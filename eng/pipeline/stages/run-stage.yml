# This stage runs a builder for any OS.

parameters:
  - name: ctx
    type: object

  # { id, os, arch, hostArch, config, distro?, experiment?, nosystemcrypto?, fips?, broken? }
  - name: builder
    type: object

  - name: createSourceArchive
    type: boolean
    default: false

  - name: createSymbols
    type: boolean
    default: false

  - name: releaseVersion
    type: string
    default: 'nil'

  - name: pool
    type: object

  # List of retry attempt numbers. Pass a list of each index (values are only for display purposes),
  # where the final element is "FINAL" instead. AzDO has limited looping capabilities, and this is a
  # way around that.
  - name: retryAttempts
    type: object
    default: ["FINAL"]

  # List of jobs that retry the builder on a fresh agent. Each entry identifies the test attempt,
  # the job name suffix, and the preceding job suffix. An empty preceding suffix starts the chain.
  - name: retryJobs
    type: object
    default:
      - { attempt: "FINAL", suffix: "", previousSuffix: "" }

stages:
  - stage: ${{ parameters.builder.id }}
    # For display name, try for readability. Use some parameters set by
    # shorthand-builders-to-builders.yml that let us add some formatting.
    displayName: ${{ parameters.builder.os }}-${{ parameters.builder.arch }} ${{ parameters.builder.hostParens}} ${{ parameters.builder.config }} ${{ parameters.builder.distroParens}} ${{ parameters.builder.experimentBrackets }} ${{ parameters.builder.nosystemcryptoBrackets }} ${{ parameters.builder.fipsAcronym }}
    dependsOn: []
    jobs:
      - ${{ each retryJob in parameters.retryJobs }}:
        - template: run-job.yml
          parameters:
            ctx: ${{ parameters.ctx }}
            builder: ${{ parameters.builder }}
            createSourceArchive: ${{ parameters.createSourceArchive }}
            createSymbols: ${{ parameters.createSymbols }}
            releaseVersion: ${{ parameters.releaseVersion }}
            pool: ${{ parameters.pool }}
            suffix: ${{ retryJob.suffix }}
            previousSuffix: ${{ retryJob.previousSuffix }}
            exportTestResult: ${{ ne(length(parameters.retryJobs), 1) }}
            ${{ if eq(length(parameters.retryJobs), 1) }}:
              retryAttempts: ${{ parameters.retryAttempts }}
            ${{ else }}:
              retryAttempts:
                - ${{ retryJob.attempt }}
