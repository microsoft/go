# The correct dnceng pool name based on the current AzDO project and branch.
${{ if ${ .isPublicExpr } }}:
  ${{ if ${ .isServicingExpr } }}:
    name: NetCore-Svc-Public
  ${{ else }}:
    name: NetCore-Public
${{ else }}:
  ${{ if ${ .isServicingExpr } }}:
    name: netcore1espool-svc-internal
  ${{ else }}:
    name: netcore1espool-internal
