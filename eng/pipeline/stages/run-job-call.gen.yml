# data inputs:
# - freshAgentRetry - Whether this is one job in the macOS retry chain.
# - retryAttempts, suffix, previousSuffix - Required when freshAgentRetry is true.

template: run-job.yml
parameters:
  ctx: ${{ parameters.ctx }}
  builder: ${{ parameters.builder }}
  createSourceArchive: ${{ parameters.createSourceArchive }}
  createSymbols: ${{ parameters.createSymbols }}
  releaseVersion: ${{ parameters.releaseVersion }}
  pool: ${{ parameters.pool }}
  ${ inlineif (default false .freshAgentRetry) }:
    retryAttempts: ${ yml .retryAttempts }
    suffix: ${ .suffix }
    previousSuffix: ${ .previousSuffix }
  ${ inlineelse }:
    retryAttempts: ${{ parameters.retryAttempts }}
