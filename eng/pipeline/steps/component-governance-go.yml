steps:
  - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
    # Keep Go off the job PATH until our build steps finish. Use the bootstrap
    # toolchain because Component Governance may not support the Go we just built.
    - pwsh: |
        . eng/utilities.ps1
        Download-Stage0
        Write-Host "##vso[task.prependpath]$(Split-Path (Get-Command go).Source)"
      displayName: Add bootstrap Go to PATH for Component Governance
      condition: succeededOrFailed()
