# Download signed binaries from the current run or a specific run.

parameters:
  - name: ctx
    type: object

  - name: runID
    type: string
    default: 'nil'

  - name: ReleaseJob
    type: boolean
    default: false

steps:
  - ${{ each platform in split(parameters.ctx['GoSigningPlatforms'], ',') }}:
    - ${{ if parameters.ReleaseJob }}:
      - task: 1ES.DownloadPipelineArtifact@1
        displayName: 'Download: Binaries Signed ${{ platform }}'
        inputs:
          ${{ if eq(parameters.runID, 'nil') }}:
            buildType: current
          ${{ else }}:
            buildType: specific
            runVersion: 'specific'
            runId: ${{ parameters.runID }}
          project: $(System.TeamProject)
          definition: $(System.DefinitionId)
          artifactName: Binaries Signed ${{ platform }}
          targetPath: '$(Pipeline.Workspace)/Binaries Signed'

      # The 1ES download task validates this artifact's SBOM. All platforms use the
      # same _manifest paths, so remove the validated manifests before merging
      # another artifact into this directory. Manifests must not be published as binaries.
      - pwsh: |
          Remove-Item -LiteralPath '$(Pipeline.Workspace)/Binaries Signed/_manifest' -Recurse -Force -ErrorAction Stop
        displayName: 'Delete SBOM manifests: Binaries Signed ${{ platform }}'

    - ${{ else }}:
      - task: DownloadPipelineArtifact@2
        displayName: 'Download: Binaries Signed ${{ platform }}'
        inputs:
          ${{ if eq(parameters.runID, 'nil') }}:
            buildType: current
          ${{ else }}:
            buildType: specific
            runVersion: 'specific'
            runId: ${{ parameters.runID }}
          project: $(System.TeamProject)
          definition: $(System.DefinitionId)
          artifact: Binaries Signed ${{ platform }}
          # Filter out manifests added by 1ES pipeline template.
          patterns: '!_manifest/**'
          targetPath: '$(Pipeline.Workspace)/Binaries Signed'
