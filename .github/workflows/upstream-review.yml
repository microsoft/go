name: Upstream review
on:
  pull_request:
    branches: ['microsoft/**']
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: upstream-review-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  fork-submodule-pin:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # Compare the test merge with its first parent.
          persist-credentials: false
      - name: Check that the fork leaves the Go submodule pin unchanged
        shell: bash
        run: |
          base_entry=$(git ls-tree HEAD^1 -- go)
          merge_entry=$(git ls-tree HEAD -- go)
          if [[ "$base_entry" != "160000 commit "* ]]; then
            message="The target branch does not have a valid Go submodule pin."
          elif [[ "$base_entry" != "$merge_entry" ]]; then
            message="Fork PRs cannot change the Go submodule pin. Remove the pin change or ask a maintainer to submit it from a branch in this repository."
          else
            echo "The Go submodule pin is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  upstream-crypto-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # Include both parents of the test merge.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: eng/_util/go.mod
          cache: false
      - name: Check upstream crypto changes
        working-directory: eng/_util
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          go tool upstreamreview check-pr-imports -update-pr-comment
          -repo "$GITHUB_REPOSITORY" -pr ${{ github.event.number }} -merge "$GITHUB_SHA"
          -upstream golang/go -submodule go -label upstream-crypto-reviewed
          -src src -import crypto/internal/fips140 -exclude src/crypto/internal/fips140
          >> "$GITHUB_STEP_SUMMARY"
