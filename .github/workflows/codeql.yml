name: "CodeQL"

on:
  push:
    branches: ["microsoft/*"]
  pull_request:
    branches: ["microsoft/*"]
  schedule:
    - cron: 29 7 * * 2

jobs:
  analyze:
    name: CodeQL Analyze with MS Go
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize submodules and install Microsoft Go
        shell: pwsh
        run: |
          eng/run.ps1 submodule-refresh -shallow

      - name: Add Microsoft Go to PATH
        run: |
          echo "$HOME/.local/share/microsoft-go/go1.24.0-1/bin" >> $GITHUB_PATH
          go version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Manually build std, cmd, and infra tools
        run: |
          GOOS=linux GOARCH=amd64 go build std
          GOOS=linux GOARCH=amd64 go build cmd/...
          pushd eng/_util
          go build ./...
          popd

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:go
