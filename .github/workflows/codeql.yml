name: "CodeQL"

on:
  push:
    branches:
      - "microsoft/*"
  pull_request:
    branches:
      - "microsoft/*"
  schedule:
    - cron: 29 7 * * 2

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: go

      - name: Build Go modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' modfile; do
            module_dir="$(dirname "$modfile")"
            echo "Building $module_dir"
            (cd "$module_dir" && go build ./...)
          done < <(find . -name go.mod -not -path './go/*' -print0)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:go
