name: Upstream crypto review
on:
  pull_request:
    branches: ['microsoft/**']
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

env:
  REVIEW_LABEL: upstream-crypto-reviewed

concurrency:
  group: upstream-crypto-review-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  upstream-crypto-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      review: ${{ steps.review.outputs.review }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # Include both parents of the test merge.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: eng/_util/go.mod
          cache: false
      - name: Check upstream crypto changes
        id: review
        working-directory: eng/_util
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          go tool upstreamreview ghreview
          -repo "$GITHUB_REPOSITORY" -pr ${{ github.event.number }} -merge "$GITHUB_SHA"
          -upstream golang/go -submodule go -label "$REVIEW_LABEL"
          -src src -import crypto/internal/fips140 -exclude src/crypto/internal/fips140
          >> "$GITHUB_STEP_SUMMARY"

  comment:
    needs: upstream-crypto-review
    # Fork PRs get the review summary without running their tool with write access.
    if: >-
      ${{ !cancelled() && needs.upstream-crypto-review.outputs.review != '' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    concurrency: upstream-crypto-comment-${{ github.event.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: eng/_util/go.mod
          cache: false
      - name: Link to the review summary
        working-directory: eng/_util
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ needs.upstream-crypto-review.outputs.review }}
        run: go tool upstreamreview comment -review "$REVIEW" -label "$REVIEW_LABEL"
